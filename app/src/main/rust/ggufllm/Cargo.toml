[package]
name = "ggufllm"
version = "2.0.0"
edition = "2024"
description = "Pure-Rust GGUF LLM inference engine (derived from RustingStrata) for Android AIDL/JNI"

[lib]
name = "ggufllm"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
memmap2 = "0.9"
rayon = "1"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.13"

[profile.release]
opt-level = 3
debug = 0
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
